name: Consolidation Vogue Marry

on:
  push:
    branches:
      - consolidation/vogue-marry-2026-09
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier la syntaxe Node
        run: |
          node --check backend/server.js
          node --check backend/transcription-server-v6.js
          node --check backend/speaker-sync-server.js
          node --check scripts/local-only.cjs

      - name: Vérifier la syntaxe Python
        run: python3 -m py_compile backend/local_transcribe.py backend/local_diarize.py

      - name: Construire le frontend
        run: npm run build
