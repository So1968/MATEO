name: Met à jour les dépendances Vogue Marry

on:
  push:
    branches:
      - consolidation/vogue-marry-2026-09
    paths:
      - .github/workflows/refresh-dependencies.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche de consolidation
        uses: actions/checkout@v4
        with:
          ref: consolidation/vogue-marry-2026-09
          fetch-depth: 0

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Mettre Vite à jour vers la version corrigée
        run: npm install vite@8.3.0 --save-exact

      - name: Corriger les dépendances transitives sûres
        run: npm audit fix

      - name: Réinstaller depuis le verrouillage
        run: npm ci

      - name: Vérifier syntaxe, tests et build
        run: |
          node --check backend/server.js
          node --check backend/transcription-server-v6.js
          python3 -m py_compile backend/local_transcribe.py backend/local_diarize.py
          npm test
          npm run build

      - name: Vérifier les vulnérabilités de production
        run: npm audit --omit=dev --audit-level=high

      - name: Enregistrer les dépendances mises à jour
        run: |
          rm -rf backend/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Met à jour les dépendances et corrige l’audit npm"
          git push origin HEAD:consolidation/vogue-marry-2026-09
