name: Finalise la consolidation Vogue Marry

on:
  push:
    branches:
      - consolidation/vogue-marry-2026-09
    paths:
      - .github/workflows/finalize-consolidation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche de consolidation
        uses: actions/checkout@v4
        with:
          ref: consolidation/vogue-marry-2026-09
          fetch-depth: 0

      - name: Appliquer la migration finale
        run: python3 scripts/finalize-consolidation.py

      - name: Vérifier la cohérence après fusion
        run: |
          npm ci
          node --check backend/server.js
          node --check backend/transcription-server-v6.js
          python3 -m py_compile backend/local_transcribe.py backend/local_diarize.py
          npm test
          npm run build

      - name: Enregistrer la consolidation finale
        run: |
          rm -rf backend/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Fusionne le service interlocuteurs et simplifie la pile locale"
          git push origin HEAD:consolidation/vogue-marry-2026-09
