name: Finalise la consolidation Vogue Marry

# Workflow temporaire de migration, à supprimer après succès.
on:
  push:
    branches:
      - consolidation/vogue-marry-2026-09
    paths:
      - .github/workflows/finalize-consolidation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche de consolidation
        uses: actions/checkout@v4
        with:
          ref: consolidation/vogue-marry-2026-09
          fetch-depth: 0

      - name: Fusionner le service interlocuteurs dans le moteur de transcription
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          server_path = Path('backend/transcription-server-v6.js')
          server = server_path.read_text()
          marker = 'app.get("/api/transcription/health", (req, res) => {'
          if '/api/transcription/:jobId/speakers' not in server:
              block = r'''
function speakerMeetingDataPath(meetingId) {
  const value = String(meetingId || "");
  const slash = value.indexOf("/");
  if (slash <= 0 || slash === value.length - 1) return null;
  const projectSlug = value.slice(0, slash);
  const meetingDir = value.slice(slash + 1);
  if (!/^[A-Za-z0-9._-]+$/.test(projectSlug) || !/^[A-Za-z0-9._-]+$/.test(meetingDir)) return null;
  if ([projectSlug, meetingDir].some((part) => part === "." || part === "..")) return null;
  const resolved = path.resolve(PROJECTS_ROOT, projectSlug, "01_escales_reunions", meetingDir, "donnees_escale.json");
  const root = path.resolve(PROJECTS_ROOT) + path.sep;
  return resolved.startsWith(root) ? resolved : null;
}

function cleanSpeakerMapping(mapping, participants) {
  if (!mapping || typeof mapping !== "object" || Array.isArray(mapping)) return {};
  const allowed = new Set((participants || []).map((name) => String(name || "").trim()).filter(Boolean));
  const clean = {};
  for (const [sourceSpeaker, rawName] of Object.entries(mapping)) {
    const speaker = String(sourceSpeaker || "").trim();
    const name = String(rawName || "").trim();
    if (!speaker || !name) continue;
    if (allowed.size && !allowed.has(name)) continue;
    clean[speaker] = name;
  }
  return clean;
}

function buildCorrectedTranscriptMarkdown(result) {
  const lines = [
    "# Transcription — Vogue Marry",
    "",
    `- Fichier : ${result.originalName || ""}`,
    result.duration ? `- Durée : ${formatClock(result.duration)}` : null,
    result.meeting?.title ? `- Escale : ${result.meeting.title}` : null,
    result.participants?.length ? `- Participants : ${result.participants.join(", ")}` : null,
    result.mode === "high" ? "- Mode : Contrôle renforcé · double lecture" : "- Mode : Local renforcé · gratuit",
    result.mode === "high" && Number.isFinite(Number(result.verification?.estimatedCostUsd))
      ? `- Coût API estimé : ${Number(result.verification.estimatedCostUsd).toFixed(2)} $`
      : "- Coût API : 0 $",
    result.speakerConfirmationsUpdatedAt ? `- Interlocuteurs confirmés : ${result.speakerConfirmationsUpdatedAt}` : null,
    result.warnings?.length ? `- Avertissements : ${result.warnings.join(" | ")}` : null,
    "",
    "## Transcription",
    ""
  ].filter(Boolean);

  for (const segment of result.segments || []) {
    lines.push(`[${formatClock(segment.start)}] ${segment.speaker || "Intervenant"} — ${segment.text || ""}`);
    lines.push("");
  }

  if (result.unresolvedSpeakers?.length) {
    lines.push("## Interlocuteurs restant à confirmer", "");
    for (const speaker of result.unresolvedSpeakers) lines.push(`- ${speaker}`);
    lines.push("");
  }

  if (result.verification?.reviewChunks?.length) {
    lines.push("## Passages à vérifier sur l'audio", "");
    for (const chunk of result.verification.reviewChunks) {
      lines.push(`- ${formatClock(chunk.start)} → ${formatClock(chunk.end)} · concordance locale/GPT ${Math.round((Number(chunk.similarity) || 0) * 100)} %`);
    }
    lines.push("");
  }

  return `${lines.join("\n").trim()}\n`;
}

function persistSpeakerMappingToMeeting(result, status, mapping, updatedAt) {
  const meetingId = result.meeting?.id || status?.meetingId || "";
  const dataPath = speakerMeetingDataPath(meetingId);
  if (!dataPath || !fs.existsSync(dataPath)) return false;

  const data = readJsonIfExists(dataPath) || {};
  const confirmations = data.transcriptionSpeakerConfirmations && typeof data.transcriptionSpeakerConfirmations === "object"
    ? data.transcriptionSpeakerConfirmations
    : {};

  confirmations[result.jobId] = {
    updatedAt,
    originalName: result.originalName || "",
    mapping
  };

  data.transcriptionSpeakerConfirmations = confirmations;
  writeJson(dataPath, data);
  return true;
}

app.post("/api/transcription/:jobId/speakers", (req, res) => {
  try {
    const dir = requestJobDir(req.params.jobId);
    if (!dir) return res.status(400).json({ error: "Identifiant de transcription invalide." });

    const resultPath = path.join(dir, "transcription.json");
    const jobStatusPath = path.join(dir, "status.json");
    if (!fs.existsSync(resultPath)) return res.status(404).json({ error: "Transcription introuvable ou inachevée." });

    const result = readJson(resultPath);
    const status = readJsonIfExists(jobStatusPath) || {};
    const mapping = cleanSpeakerMapping(req.body?.mapping, result.participants || []);
    if (!Object.keys(mapping).length) return res.status(400).json({ error: "Aucune correspondance d'interlocuteur valide." });

    const updatedAt = new Date().toISOString();
    const mergedOverrides = { ...(result.speakerOverrides || {}), ...mapping };

    result.segments = (result.segments || []).map((segment) => {
      const confirmed = mergedOverrides[segment.sourceSpeaker];
      return confirmed
        ? { ...segment, speaker: confirmed, speakerConfidence: "confirme-manuel" }
        : segment;
    });
    result.speakerOverrides = mergedOverrides;
    result.unresolvedSpeakers = Array.from(new Set(
      result.segments
        .filter((segment) => segment.speakerConfidence === "non-identifie")
        .map((segment) => segment.speaker)
        .filter(Boolean)
    ));
    result.speakerConfirmationsUpdatedAt = updatedAt;
    result.text = result.segments.map((segment) => `${segment.speaker || "Intervenant"} — ${segment.text || ""}`).join("\n");

    writeJson(resultPath, result);
    fs.writeFileSync(path.join(dir, "transcription.md"), buildCorrectedTranscriptMarkdown(result), "utf8");

    const persistedToMeeting = persistSpeakerMappingToMeeting(result, status, mergedOverrides, updatedAt);
    writeJson(jobStatusPath, {
      ...status,
      jobId: result.jobId,
      speakerConfirmationsUpdatedAt: updatedAt,
      speakerConfirmationsPersistedToMeeting: persistedToMeeting,
      updatedAt
    });

    return res.json({
      status: "ok",
      persistedToMeeting,
      mapping: mergedOverrides,
      unresolvedSpeakers: result.unresolvedSpeakers,
      result
    });
  } catch (error) {
    return res.status(500).json({ error: error.message || "Impossible d'enregistrer les interlocuteurs." });
  }
});

'''
              if marker not in server:
                  raise SystemExit('Point insertion moteur transcription introuvable')
              server = server.replace(marker, block + marker, 1)
              server_path.write_text(server)

          view_path = Path('src/TranscriptionView.jsx')
          view = view_path.read_text()
          view = view.replace('const SPEAKER_API = "http://localhost:8012";\n', '')
          view = view.replace('`${SPEAKER_API}/api/transcription/${encodeURIComponent(result.jobId)}/speakers`', '`${API}/api/transcription/${encodeURIComponent(result.jobId)}/speakers`')
          view_path.write_text(view)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['transcription'] = 'VOGUE_WHISPER_MODEL=large-v3-turbo node backend/transcription-server-v6.js'
          package['dependencies']['cors'] = '2.8.6'
          package['dependencies']['express'] = '5.2.1'
          package['devDependencies']['concurrently'] = '9.2.1'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text())
          root = lock['packages']['']
          root['dependencies']['cors'] = '2.8.6'
          root['dependencies']['express'] = '5.2.1'
          root['devDependencies']['concurrently'] = '9.2.1'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n')

          ci_path = Path('.github/workflows/consolidation.yml')
          ci = ci_path.read_text().replace('          node --check backend/speaker-sync-server.js\n', '')
          ci_path.write_text(ci)

          tests_path = Path('tests/consolidation.test.mjs')
          tests = tests_path.read_text()
          tests = tests.replace('    "backend/transcription-server-v6.js",\n    "backend/speaker-sync-server.js"\n', '    "backend/transcription-server-v6.js"\n')
          tests = tests.replace('  assert.match(view, /SPEAKER_API/u);\n', '  assert.doesNotMatch(view, /SPEAKER_API/u);\n  assert.equal(exists("backend/speaker-sync-server.js"), false);\n  assert.match(read("backend/transcription-server-v6.js"), /\\/api\\/transcription\\/:jobId\\/speakers/u);\n')
          tests_path.write_text(tests)

          api_test_path = Path('tests/local-api.test.mjs')
          api_tests = api_test_path.read_text()
          old = '''test("API interlocuteurs : reste locale et ne nécessite aucun secret pour sa santé", async () => {\n  await withServer("backend/speaker-sync-server.js", 8012, async () => {\n    const response = await fetch("http://127.0.0.1:8012/api/speaker-sync/health", {\n      headers: { Origin: "http://localhost:5173" }\n    });\n    assert.equal(response.status, 200);\n    assert.equal(response.headers.get("access-control-allow-origin"), "http://localhost:5173");\n    const payload = await response.json();\n    assert.equal(payload.host, "127.0.0.1");\n  });\n});\n'''
          new = '''test("API interlocuteurs : est intégrée au moteur de transcription", async () => {\n  await withServer("backend/transcription-server-v6.js", 8011, async () => {\n    const response = await fetch("http://127.0.0.1:8011/api/transcription/job-inexistant/speakers", {\n      method: "POST",\n      headers: {\n        "Content-Type": "application/json",\n        Origin: "http://localhost:5173"\n      },\n      body: JSON.stringify({ mapping: { SPEAKER_00: "Test" } })\n    });\n    assert.equal(response.status, 404);\n    assert.equal(response.headers.get("access-control-allow-origin"), "http://localhost:5173");\n  });\n});\n'''
          if old not in api_tests:
              raise SystemExit('Test speaker-sync attendu introuvable')
          api_test_path.write_text(api_tests.replace(old, new))

          speaker_path = Path('backend/speaker-sync-server.js')
          if speaker_path.exists():
              speaker_path.unlink()

          req_path = Path('requirements-transcription.txt')
          req_path.write_text('faster-whisper>=1.1,<2\npyannote.audio>=4,<5\n')
          setup_path = Path('scripts/setup-local-transcription.sh')
          setup = setup_path.read_text().replace('"$VENV/bin/python" -m pip install "faster-whisper>=1.1,<2" "pyannote.audio>=4,<5"', '"$VENV/bin/python" -m pip install -r "$ROOT/requirements-transcription.txt"')
          setup_path.write_text(setup)

          docs_path = Path('docs/CONSOLIDATION_2026-09.md')
          docs = docs_path.read_text()
          docs = docs.replace('- `backend/speaker-sync-server.js` : service temporaire de confirmation des interlocuteurs, à absorber ensuite dans l\'API de transcription\n', '')
          docs = docs.replace('- [ ] absorber `speaker-sync-server.js` dans `transcription-server-v6.js` pour supprimer le port 8012 ;\n', '- [x] service de confirmation des interlocuteurs absorbé dans `transcription-server-v6.js` ; le port 8012 a été supprimé ;\n')
          docs = docs.replace('- [ ] créer un fichier de dépendances Python reproductible ;\n', '- [x] dépendances Python directes centralisées dans `requirements-transcription.txt` ;\n')
          docs = docs.replace('1. Absorber le service 8012 dans le moteur de transcription.\n2. Retester CI après suppression du service temporaire.\n3. Rendre les dépendances Python reproductibles.\n4. Ajouter lint et tests de routes.\n', '1. Retester CI après suppression du service 8012.\n2. Ajouter lint et approfondir les tests fonctionnels des routes.\n3. Valider une transcription locale courte sur le poste réel.\n')
          docs_path.write_text(docs)
          PY

      - name: Vérifier la cohérence après fusion
        run: |
          npm ci
          node --check backend/server.js
          node --check backend/transcription-server-v6.js
          python3 -m py_compile backend/local_transcribe.py backend/local_diarize.py
          npm test
          npm run build

      - name: Enregistrer la consolidation finale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Fusionne le service interlocuteurs et simplifie la pile locale"
          git push origin HEAD:consolidation/vogue-marry-2026-09
