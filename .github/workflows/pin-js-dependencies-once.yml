name: Pin JS dependencies once

on:
  push:
    branches:
      - consolidation/vogue-marry-2026-09

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche de consolidation
        uses: actions/checkout@v4
        with:
          ref: consolidation/vogue-marry-2026-09

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verrouiller les versions déjà validées par le lockfile
        run: npm install --save-exact @vitejs/plugin-react@6.0.1 lucide-react@1.14.0 react@19.2.5 react-dom@19.2.5 vite@8.0.10

      - name: Enregistrer uniquement si nécessaire
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Les dépendances sont déjà verrouillées."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Verrouille les dépendances frontend validées"
          git push origin HEAD:consolidation/vogue-marry-2026-09
